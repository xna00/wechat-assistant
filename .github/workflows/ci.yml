name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + rolldown + brotli embed)
        run: npm run build

      # 组装 GitHub Pages 产物：完整版 + live 版（entry.js + chunk-*.js）+ 下载页
      - name: Assemble pages
        run: |
          mkdir -p dist-pages
          cp dist/app.exe dist-pages/wechat-assistant.exe
          cp dist-live/wechat-assistant-live.exe dist-pages/wechat-assistant-live.exe
          cp dist-live/entry.js dist-pages/entry.js
          cp dist-live/chunk-*.js dist-pages/
          cp pages/index.html dist-pages/index.html
          touch dist-pages/.nojekyll

      - name: Upload exe artifact
        uses: actions/upload-artifact@v6
        with:
          name: wechat-assistant-exe
          path: dist/app.exe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy-pages:
    # 仅 main 的 push 发布；PR 只构建验证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
